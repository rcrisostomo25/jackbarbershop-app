<div class="forgot-password-wrapper">
  <div class="container-fluid d-flex align-items-center justify-content-center min-vh-100">
    <div class="forgot-password-card">
      <!-- Header -->
      <div class="forgot-password-header text-center mb-4">
        <h1 class="forgot-password-title mb-2">Jack BarberShop</h1>
        <p class="forgot-password-subtitle">Recuperar Contraseña</p>
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage()" class="alert alert-success alert-dismissible fade show" role="alert">
        <small>{{ successMessage() }}</small>
        <button type="button" class="btn-close" (click)="successMessage.set('')"></button>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage()" class="alert alert-danger alert-dismissible fade show" role="alert">
        <small>{{ errorMessage() }}</small>
        <button type="button" class="btn-close" (click)="errorMessage.set('')"></button>
      </div>

      <!-- Description -->
      <p class="forgot-password-description text-center text-muted mb-4">
        Ingresa tu correo electrónico y te enviaremos un enlace para recuperar tu contraseña.
      </p>

      <!-- Form -->
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate>
        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="tu@email.com"
            formControlName="email"
            [class.is-invalid]="submitted() && email?.invalid"
            [disabled]="isLoading()"
          />
          <div class="invalid-feedback d-block" *ngIf="submitted() && email?.invalid">
            <small *ngIf="email!.errors?.['required']">El email es requerido</small>
            <small *ngIf="email!.errors?.['email']">Email inválido</small>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="btn btn-primary w-100 mb-3"
          [disabled]="isLoading()"
        >
          <span *ngIf="!isLoading()">Enviar Enlace</span>
          <span *ngIf="isLoading()">
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Enviando...
          </span>
        </button>
      </form>

      <!-- Footer Links -->
      <div class="forgot-password-footer">
        <p class="text-center text-muted mb-2">
          ¿Recuerdas tu contraseña?
          <a routerLink="/login" class="text-decoration-none text-accent fw-bold">
            Iniciar Sesión
          </a>
        </p>
        <p class="text-center text-muted">
          ¿No tienes cuenta?
          <a routerLink="/register" class="text-decoration-none text-accent fw-bold">
            Registrarse
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
